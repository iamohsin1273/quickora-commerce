apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: quickora
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/iamohsin1273/quickora-commerce.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: quickora
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
